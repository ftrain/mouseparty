<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="referrer" content="no-referrer">
    <title>Mouse Party</title>
    <!-- Served by the host's Mac (host.go); every URL carries the session key.
         Layout follows YouTube's live pages: chat beside the video on a desktop,
         under it on an upright phone, floating over it like subtitles on a
         phone on its side (data-mode, set by host.js). Nothing of ours sits on
         the picture: that's the browser's own player's, full screen included. -->
    <link rel="icon" type="image/png" href="/{{KEY}}/assets/icon.png">
    <link rel="stylesheet" href="/{{KEY}}/assets/host.css">
</head>
<body>
    <div class="app" id="app" data-mode="side">
        <div class="stage" id="stage">
            <video id="video" aria-label="The movie" controls autoplay muted playsinline></video>
            <div class="badge" id="streamStatus" aria-hidden="true">
                <span class="dot" id="statusIndicator"></span>
                <span id="statusText">Connecting...</span>
            </div>
            <div class="sound-prompt" id="soundPrompt" hidden>
                <button class="sound-button" id="soundButton">🔇 Sound is off &mdash; click to turn it on</button>
                <button class="sound-dismiss" id="soundDismiss" title="Keep it off" aria-label="Dismiss, keep the sound off">✕</button>
            </div>
            <!-- A PDF or another document the host is reading with everyone, drawn here a page at a time (pdf.js, or Tiny Little Office's pages); or a database's pages, Datasette's (datasette.go) -->
            <div class="doc" id="doc" hidden>
                <div class="doc-scroll" id="docScroll"><canvas id="docCanvas"></canvas></div>
                <div class="doc-bar">
                    <!-- everyone's page, which anyone turns; or, reading on one's own, this viewer's alone. Chat says which (pace.go) -->
                    <input type="range" class="doc-slider" id="docSlider" min="1" max="2" step="1" aria-label="Page" hidden>
                    <span class="doc-page" id="docPage"></span>
                    <button class="doc-zoom" id="docAlone" hidden>read on my own</button>
                    <button class="doc-zoom" id="docNotes" title="Stick notes on pages (Stickies)" hidden>notes</button>
                    <!-- everyone's pace: anyone makes it faster or slower, for all -->
                    <span class="doc-pace" id="docPace" hidden>
                        <button class="doc-zoom" id="docSlower" title="Slower, for everyone" aria-label="Slower">−</button>
                        <span id="docPaceText"></span>
                        <button class="doc-zoom" id="docFaster" title="Faster, for everyone" aria-label="Faster">+</button>
                    </span>
                    <button class="doc-zoom" id="docZoom" title="Fit the width (or double-click the page)">fit width</button>
                </div>
            </div>
            <!-- The apps open (apps.go), each a window this viewer moves and sizes: host.js loads their scripts from apps/ -->
            <div class="desk" id="desk"></div>
            <div class="captions" id="captions" hidden></div>
            <!-- the chat, when there's no column for it: halfway down the right edge, where no player puts its controls -->
            <button class="chat-tab" id="chatTab" title="Chat" aria-label="Show chat">💬<span class="unread" id="unread" hidden></span></button>
        </div>

        <!-- What's on, like a cable listing, in the viewer's own time zone (host.js fills it) -->
        <div class="guide" id="guide" hidden>
            <div class="guide-box" role="dialog" aria-label="What's on">
                <div class="guide-head">
                    <a class="guide-logo" href="https://ftrain.github.io/mouseparty/" target="_blank" rel="noopener noreferrer"><img src="/{{KEY}}/assets/icon.png" alt="Mouse Party" width="36" height="36"></a>
                    <span class="guide-title">MOUSE PARTY GUIDE</span>
                    <span class="guide-zone" id="guideZone"></span>
                    <span class="guide-clock" id="guideClock"></span>
                    <button class="guide-close" id="guideClose" title="Close" aria-label="Close">✕</button>
                </div>
                <div class="guide-rows" id="guideRows"></div>
            </div>
        </div>

        <aside class="chat" id="chat">
            <header class="chat-head">
                <span class="title">Live chat</span>
                <span class="stream-state" role="status"><span class="dot" id="headerDot"></span><span id="headerStatus">Connecting...</span></span>
                <span class="count" id="viewerCount"></span>
                <span class="conn" id="chatConnectionIndicator">connecting…</span>
                <span class="tools">
                    <button class="head-btn" id="captionsBtn" title="Subtitles" aria-label="Subtitles" hidden>CC</button>
                    <button class="head-btn" id="guideBtn" title="What's on" aria-label="What's on">GUIDE</button>
                    <button class="hide-chat" id="hideChat" title="Hide chat" aria-label="Hide chat">⟩</button>
                </span>
                <div class="menu" id="captionsMenu" hidden></div>
            </header>
            <div class="online" id="onlineUsers" role="status"></div>
            <!-- the apps open: hide or show one (a desktop), or on a phone a tab each beside Chat -->
            <div class="app-tabs" id="appTabs" hidden></div>
            <div class="dock" id="dock"></div>
            <div class="messages" id="chatMessagesOverlay" role="log" aria-live="polite" aria-label="Chat" tabindex="0"></div>
            <div class="composer">
                <div class="picker" id="picker" hidden></div>
                <!-- the name, asked as a question over its box: in the chat box's place, it was taken for it ("hi") -->
                <label class="join-ask" id="joinAsk" for="usernameInput">What's your name?</label>
                <div class="row" id="joinOverlay">
                    <input type="text" id="usernameInput" placeholder="Your name" maxlength="30" autocomplete="given-name" enterkeyhint="done" />
                    <button id="joinBtn" class="btn">Join chat</button>
                    <button class="btn plus" title="Open an app for everyone" aria-label="Open an app">+</button>
                </div>
                <div class="row" id="chatInputBox" style="display: none;">
                    <button id="nameBtn" class="chip" title="Change name" aria-label="Change name"><span id="currentUserDisplay"></span></button>
                    <textarea id="messageInput" rows="1" aria-label="Message" placeholder="Say something..." maxlength="500" autocomplete="off"></textarea>
                    <button class="btn plus" title="Open an app for everyone" aria-label="Open an app">+</button>
                </div>
            </div>
        </aside>
    </div>
    <script>window.MOUSEPARTY_BASE = '/{{KEY}}';</script>
    <script src="/{{KEY}}/assets/hls.min.js"></script>
    <script src="/{{KEY}}/assets/host.js"></script>
</body>
</html>

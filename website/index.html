<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mouse Party</title>
<meta name="description" content="Have friends over online! Watch a movie, chat, play some games. It runs from your Mac and it's all gone when you quit.">
<meta property="og:title" content="Mouse Party">
<meta property="og:description" content="Have friends over, online. Hosted from your own Mac, and gone when you quit.">
<meta property="og:image" content="https://ftrain.github.io/mouseparty/icon.png">
<link rel="icon" type="image/png" href="icon.png">
<style>
/* One column of plain prose, as wide as a paragraph reads well; the icon's night sky and party hat for colour. */
:root {
    --ground: #fbf8fd;
    --ink: #241338;
    --quiet: #6b5a80;
    --rule: #e4daee;
    --link: #a3206f;
    --button: #2b1450;
    --button-ink: #ffffff;
    --frame: #1a1030;
    --prose: Charter, "Iowan Old Style", "Palatino Linotype", Georgia, serif;
    --display: ui-rounded, "SF Pro Rounded", "Arial Rounded MT Bold", system-ui, sans-serif;
    --plain: system-ui, -apple-system, "Helvetica Neue", sans-serif;
}
@media (prefers-color-scheme: dark) {
    :root {
        --ground: #1a1030;
        --ink: #efe8f6;
        --quiet: #a999bd;
        --rule: #3a2658;
        --link: #ff8fbf;
        --button: #ff7ab6;
        --button-ink: #1a1030;
        --frame: #0d0718;
        color-scheme: dark;
    }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
    margin: 0;
    padding: 3.5rem max(1.25rem, env(safe-area-inset-right)) 4rem max(1.25rem, env(safe-area-inset-left));
    background: var(--ground);
    color: var(--ink);
    font: 1.1875rem/1.6 var(--prose);
}
main { max-width: 34rem; margin: 0 auto; }
header { margin-bottom: 2.5rem; }
header img { display: block; width: 8rem; height: 8rem; margin: 0 0 0.5rem -0.75rem; }
h1 { font: 700 2.75rem/1.1 var(--display); letter-spacing: -0.01em; margin: 0 0 0.75rem; }
h2 { font: 700 1.375rem/1.25 var(--display); margin: 2.75rem 0 0.5rem; text-wrap: balance; }
p { margin: 0 0 1.1rem; }
.lede { font-size: 1.375rem; line-height: 1.45; }
a { color: var(--link); text-underline-offset: 0.15em; }
a:focus-visible { outline: 2px solid var(--link); outline-offset: 3px; border-radius: 4px; }
.get { display: flex; flex-wrap: wrap; gap: 0.75rem 1.5rem; align-items: center; margin: 1.75rem 0 0.75rem; font-family: var(--plain); }
.get a { display: inline-flex; align-items: center; gap: 0.6rem; font-weight: 600; font-size: 1.0625rem; }
.get svg { width: 1.3em; height: 1.3em; flex: none; }
.get .download { background: var(--button); color: var(--button-ink); text-decoration: none; padding: 0.8rem 1.3rem; border-radius: 999px; }
.get .download:hover { filter: brightness(1.15); }
.small { font: 0.9375rem/1.5 var(--plain); color: var(--quiet); }
figure { margin: 2.25rem 0; }
figure img { display: block; width: 100%; height: auto; border-radius: 10px; border: 1px solid var(--rule); background: var(--frame); }
figure.window img { width: auto; max-width: min(100%, 22rem); margin: 0 auto; }
figcaption { font: 0.8125rem/1.4 var(--plain); color: var(--quiet); margin-top: 0.5rem; text-align: center; }
footer { margin-top: 3.5rem; padding-top: 1.25rem; border-top: 1px solid var(--rule); }
</style>
</head>
<body>
<main>
<header>
    <img src="icon.png" alt="" width="256" height="256">
    <h1>Mouse Party</h1>
    <p class="lede">Have friends over online! Watch a movie, chat, play some games. It runs from your Mac and it's all gone when you quit.</p>
    <div class="get">
        <a class="download" href="https://github.com/ftrain/mouseparty/releases/latest/download/MouseParty-macos-arm64.dmg">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3"/><path d="m7 10 5 5 5-5"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/></svg>
            Download for Mac
        </a>
        <a href="https://github.com/ftrain/mouseparty">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m16 18 6-6-6-6"/><path d="m8 6-6 6 6 6"/></svg>
            Source Code
        </a>
    </div>
</header>

<figure class="window">
    <img src="shots/window.png" alt="The Mouse Party window on the Mac: a list of movies, music and documents under two big buttons" width="1040" height="940">
    <figcaption>Watch movies and more</figcaption>
</figure>

<figure>
    <img src="shots/together.png" alt="A friend's view in the browser: the picture, with drawing pens over it, and the chat beside it" width="1280" height="720" loading="lazy">
    <figcaption>Chat and play</figcaption>
</figure>

<figure>
    <img src="shots/game.png" alt="A tile word game open in a window over the movie" width="1280" height="720" loading="lazy">
    <figcaption>Word games, too!</figcaption>
</figure>

<footer class="small">
    <p>MIT licence, no warranty.</p>
</footer>
</main>
</body>
</html>

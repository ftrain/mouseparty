<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Mouse Party's icon: a mouse in a party hat, under confetti, on the night
       sky. scripts/make_icon.sh renders it to packaging/appicon.png (the macOS
       grid: an 824 rounded square, centred) -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#1c1146"/>
      <stop offset="0.6" stop-color="#4a1670"/>
      <stop offset="1" stop-color="#a8237e"/>
    </linearGradient>
    <radialGradient id="fur" cx="0.42" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#e9e6f2"/>
      <stop offset="0.7" stop-color="#b9b3cc"/>
      <stop offset="1" stop-color="#8f88a8"/>
    </radialGradient>
    <radialGradient id="ear" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffb3d1"/>
      <stop offset="1" stop-color="#f27aa8"/>
    </radialGradient>
    <linearGradient id="hat" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe066"/>
      <stop offset="1" stop-color="#ff9a3c"/>
    </linearGradient>
    <clipPath id="cone"><path d="M512 150 L630 400 L394 400 Z"/></clipPath>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#12062b" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#sky)"/>

  <!-- confetti -->
  <g>
    <rect x="200" y="210" width="34" height="14" rx="4" fill="#3ee0ff" transform="rotate(-25 217 217)"/>
    <rect x="790" y="230" width="34" height="14" rx="4" fill="#ffe066" transform="rotate(30 807 237)"/>
    <rect x="230" y="420" width="30" height="13" rx="4" fill="#ff7ab6" transform="rotate(50 245 426)"/>
    <rect x="770" y="440" width="30" height="13" rx="4" fill="#7dff8a" transform="rotate(-40 785 446)"/>
    <circle cx="300" cy="165" r="11" fill="#ffe066"/>
    <circle cx="720" cy="160" r="11" fill="#3ee0ff"/>
    <circle cx="170" cy="330" r="9" fill="#7dff8a"/>
    <circle cx="860" cy="350" r="9" fill="#ff7ab6"/>
    <rect x="365" y="200" width="26" height="12" rx="4" fill="#7dff8a" transform="rotate(20 378 206)"/>
    <rect x="640" y="205" width="26" height="12" rx="4" fill="#ff7ab6" transform="rotate(-15 653 211)"/>
  </g>

  <g filter="url(#soft)">
    <!-- ears -->
    <circle cx="300" cy="470" r="150" fill="url(#fur)"/>
    <circle cx="300" cy="470" r="100" fill="url(#ear)"/>
    <circle cx="724" cy="470" r="150" fill="url(#fur)"/>
    <circle cx="724" cy="470" r="100" fill="url(#ear)"/>
    <!-- head -->
    <ellipse cx="512" cy="630" rx="255" ry="225" fill="url(#fur)"/>
  </g>

  <!-- the hat, tipped a little, its stripes and its pompom -->
  <g transform="rotate(8 512 420)">
    <path d="M512 150 L630 400 L394 400 Z" fill="url(#hat)"/>
    <g clip-path="url(#cone)" fill="#e2337f">
      <rect x="380" y="205" width="270" height="34" transform="rotate(-18 512 222)"/>
      <rect x="380" y="282" width="270" height="34" transform="rotate(-18 512 299)"/>
      <rect x="380" y="359" width="270" height="34" transform="rotate(-18 512 376)"/>
    </g>
    <rect x="380" y="392" width="264" height="26" rx="13" fill="#3ee0ff"/>
    <circle cx="512" cy="146" r="38" fill="#ff7ab6"/>
    <circle cx="500" cy="134" r="12" fill="#ffd0e4"/>
  </g>

  <!-- face -->
  <ellipse cx="432" cy="620" rx="34" ry="42" fill="#1a1030"/>
  <ellipse cx="592" cy="620" rx="34" ry="42" fill="#1a1030"/>
  <circle cx="444" cy="604" r="12" fill="#fff"/>
  <circle cx="604" cy="604" r="12" fill="#fff"/>
  <ellipse cx="372" cy="700" rx="40" ry="22" fill="#ff8fbf" opacity="0.55"/>
  <ellipse cx="652" cy="700" rx="40" ry="22" fill="#ff8fbf" opacity="0.55"/>
  <ellipse cx="512" cy="712" rx="30" ry="22" fill="#e2337f"/>
  <path d="M482 752 Q512 784 542 752" fill="none" stroke="#1a1030" stroke-width="10" stroke-linecap="round"/>
  <g stroke="#5a5070" stroke-width="7" stroke-linecap="round" opacity="0.8">
    <path d="M462 722 L330 700"/>
    <path d="M462 738 L328 752"/>
    <path d="M562 722 L694 700"/>
    <path d="M562 738 L696 752"/>
  </g>
</svg>

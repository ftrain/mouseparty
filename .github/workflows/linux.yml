name: Linux sandbox and desktop smoke test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    # 26.04 ships bubblewrap with --ro-bind-fd; 24.04's 0.9 does not.
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - name: Install Linux sandbox, desktop and media dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends apparmor bubblewrap build-essential \
            ca-certificates curl ffmpeg fonts-dejavu-core libgtk-3-dev libwebkit2gtk-4.1-dev perl pkg-config
          # Use Ubuntu's scoped bwrap permission, not a system-wide userns override.
          if [ "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || true)" = 1 ]; then
            sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
          fi

      - name: Run Linux tests and self-test the production desktop binary
        env:
          TMPDIR: ${{ runner.temp }}
        run: scripts/test_linux.sh

# Build "Mouse Party.app" on an Apple Silicon runner and check it hosts, on every
# push to main and every pull request: the disk image is kept as the run's artifact
# (Actions tab > the run > Artifacts). A v* tag also attaches it to a release:
#   git tag v1.0.0 && git push origin v1.0.0
# Run it by hand from the Actions tab (workflow_dispatch) for any branch.
#
# Release builds carry everything: MediaMTX and cloudflared (pinned release
# binaries) and Mouse Party's own cut-down static ffmpeg (scripts/build_ffmpeg.sh,
# BUNDLE_FFMPEG), so they run on a Mac with nothing installed.
#
# A tag's build is signed with a Developer ID and notarized when the repository has these
# secrets (Settings > Secrets and variables > Actions); without them it's signed ad hoc, and
# the first open needs System Settings > Privacy & Security > Open Anyway (see README):
#   MACOS_CERTIFICATE_P12        the "Developer ID Application" certificate and its key, exported
#                                from Keychain Access as .p12, then base64 (base64 -i cert.p12 | pbcopy)
#   MACOS_CERTIFICATE_PASSWORD   the password it was exported with
#   APPLE_API_KEY_P8             an App Store Connect API key (Users and Access > Integrations >
#                                App Store Connect API, "Developer" access): the .p8 file's text
#   APPLE_API_KEY_ID             its key ID
#   APPLE_API_ISSUER_ID          the issuer ID above the keys
# Once a release is signed, every later one must be: the app takes only an update signed by
# the same developer (updates.go checkBundle).
name: Mac app

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:                   # a newer push to the same branch replaces a build still running
  group: mac-app-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: macos-15          # Apple Silicon; the app is arm64 only
    permissions:
      contents: write          # to create the release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4   # the pages' TypeScript (scripts/build_web.sh)
        with:
          node-version: 24
          cache: npm

      - name: MediaMTX and cloudflared
        # their pinned, checked releases (scripts/fetch_tools.sh), as every build and test
        # uses: not Homebrew's, which was behind (its MediaMTX 1.20.1 can't read the stand-by card)
        run: |
          scripts/fetch_tools.sh
          echo "$PWD/build/tools" >> "$GITHUB_PATH"

      - name: ffmpeg, cut down (cached until scripts/build_ffmpeg.sh changes)
        id: ffmpeg
        uses: actions/cache/restore@v6
        with:
          path: build/ffmpeg/bin
          key: ffmpeg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build_ffmpeg.sh') }}

      - name: Build ffmpeg
        if: steps.ffmpeg.outputs.cache-hit != 'true'
        run: brew install meson ninja pkg-config && scripts/build_ffmpeg.sh

      - name: Keep ffmpeg for next time
        # saved now, not at the end: a later step failing would otherwise lose it
        if: steps.ffmpeg.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: build/ffmpeg/bin
          key: ${{ steps.ffmpeg.outputs.cache-primary-key }}

      - name: Python for Datasette, as WebAssembly (cached until scripts/build_python.sh or its packages change)
        id: python
        uses: actions/cache/restore@v6
        with:
          path: build/python/dist
          key: python-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build_python.sh', 'scripts/python-requirements.txt', 'scripts/python-build-requirements.txt') }}

      - name: Build Python
        if: steps.python.outputs.cache-hit != 'true'
        run: scripts/build_python.sh

      - name: Keep Python for next time
        if: steps.python.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: build/python/dist
          key: ${{ steps.python.outputs.cache-primary-key }}

      - name: The Developer ID, when the repository has one (a tag's build only)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          CERT_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          if [ -z "$CERT_P12" ]; then echo "No MACOS_CERTIFICATE_P12 secret: this build is signed ad hoc"; exit 0; fi
          KC="$RUNNER_TEMP/signing.keychain-db"; KCPW=$(uuidgen)
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KCPW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          ID=$(security find-identity -v -p codesigning "$KC" | grep -o '"Developer ID Application: [^"]*"' | head -1 | tr -d '"')
          [ -n "$ID" ] || { echo "The certificate isn't a Developer ID Application one"; exit 1; }
          echo "SIGN_IDENTITY=$ID" >> "$GITHUB_ENV"
          if [ -n "$API_KEY_P8" ]; then
            printf '%s\n' "$API_KEY_P8" > "$RUNNER_TEMP/notary.p8"
            { echo "NOTARY_KEY=$RUNNER_TEMP/notary.p8"; echo "NOTARY_KEY_ID=$API_KEY_ID"; echo "NOTARY_ISSUER=$API_ISSUER"; } >> "$GITHUB_ENV"
          else
            echo "No APPLE_API_KEY_P8 secret: signed, but not notarized"
          fi

      - name: Build
        env:
          VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'dev' }} # a release knows its version, and updates itself (updates.go)
        run: BUNDLE_FFMPEG=1 scripts/build_mac_app.sh

      - name: The pages built are the ones checked in
        # host_web/ and frontend/ hold what scripts/build_web.sh (run by the build) makes from web/: a change to the
        # TypeScript goes in with what it builds, so Go alone builds the app from a clone
        run: git diff --exit-code -- host_web frontend && test -z "$(git status --porcelain -- host_web frontend)"

      - name: Playwright and Chromium, for the pages in a browser (browser_test.go)
        # global, beside the pages' own pinned tools rather than in them: nothing of it is the app's
        env:
          PLAYWRIGHT: 1.63.0
        run: |
          npm install -g "playwright@$PLAYWRIGHT"
          npx -y "playwright@$PLAYWRIGHT" install chromium
          echo "NODE_PATH=$(npm root -g)" >> "$GITHUB_ENV"

      - name: Tests
        env:
          NO_SKIPS: 1 # a test that skips is a layer gone missing (scripts/testreport)
          # the app has no ffprobe, so that comparison is the nightly fuzz.yml's, with Homebrew's
          ALLOW_SKIPS: ^(TestPreviewAudioCard|TestInspectAgreesWithFFprobe)$
        run: scripts/test.sh

      - name: Self-test the built app
        # hosts from this runner (no router involved), checks the page, the
        # stand-by stream and the WebRTC handshake, and publishes a countdown
        # with the bundled ffmpeg
        run: env -i HOME="$HOME" PATH=/usr/bin:/bin "dist/Mouse Party.app/Contents/MacOS/MouseParty" --selftest

      - name: Fuzz the command graph, a minute of each fuzzer (fuzz.yml searches longer, nightly)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        env:
          FUZZTIME: 1m
        run: scripts/fuzz.sh

      - name: Keep what the fuzzers found
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-failures
          path: |
            testdata/fuzz
            apps/testdata/fuzz
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: MouseParty-macos-arm64
          path: dist/MouseParty-macos-arm64.dmg

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        # two files: the app, and (as the GPL asks) the exact sources of the ffmpeg and pandoc
        # inside it, in one archive
        run: |
          scripts/build_ffmpeg.sh --fetch
          scripts/fetch_pandoc.sh --fetch
          SOURCES="MouseParty-$GITHUB_REF_NAME-gpl-sources.tar"
          tar -cf "dist/$SOURCES" -C build/ffmpeg/src . -C ../../pandoc/src .
          if [ -n "${SIGN_IDENTITY:-}" ]; then
            FIRST="It's signed and notarized: it opens like any app."
          else
            FIRST="The first time it opens: System Settings > Privacy & Security > Open Anyway."
          fi
          gh release create "$GITHUB_REF_NAME" dist/MouseParty-macos-arm64.dmg "dist/$SOURCES" \
            --title "Mouse Party $GITHUB_REF_NAME" \
            --notes "MouseParty-macos-arm64.dmg is the app, for Apple Silicon Macs with macOS 13 or later: open it and drag Mouse Party to Applications. $FIRST From then on it updates itself (Settings > General). $SOURCES is only for the GPL: the exact sources of the ffmpeg inside it, which scripts/build_ffmpeg.sh builds from, and of its pandoc (its own WebAssembly release build, scripts/fetch_pandoc.sh)."

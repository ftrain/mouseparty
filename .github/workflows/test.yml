# Test and fuzz on Linux, beside the Mac app's build (mac-app.yml): quicker, and
# nightly it fuzzes the command graph for longer (docs/testing.md).
#
#   every push to main and pull request: scripts/test.sh (the pages, vet, every
#     test with the fuzzers' seeds and what they've found before, the pages in
#     headless Chromium, the self-test), then a minute of each fuzzer
#   every night, or by hand: each fuzzer, and the pages walked with new seeds, for FUZZTIME
#
# A fuzzer that finds something fails the run, and the input it failed on is kept
# as the run's artifact (testdata/fuzz/...): put it in the repo beside the fix,
# and `go test` runs it from then on.
name: Test

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      fuzztime:
        description: How long each fuzzer runs (Go duration)
        default: 15m

concurrency:
  group: test-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4 # the pages' TypeScript (scripts/build_web.sh)
        with:
          node-version: 24
          cache: npm

      - name: ffmpeg, MediaMTX and cloudflared
        # Ubuntu's ffmpeg has what the tests use (drawtext, libx264, libopus); MediaMTX and
        # cloudflared are the pinned releases every build uses (scripts/fetch_tools.sh)
        run: |
          sudo apt-get update -q && sudo apt-get install -yq ffmpeg
          scripts/fetch_tools.sh
          echo "$PWD/build/tools" >> "$GITHUB_PATH"

      - name: Python for Datasette (cached until scripts/build_python.sh or its packages change)
        # the same WebAssembly as the Mac's, built here with Linux's WASI SDK, so Datasette's tests run on Linux too
        id: python
        uses: actions/cache/restore@v4
        with:
          path: build/python/dist
          key: python-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build_python.sh', 'scripts/python-requirements.txt', 'scripts/python-build-requirements.txt') }}

      - name: Build Python
        if: steps.python.outputs.cache-hit != 'true'
        run: scripts/build_python.sh

      - name: Keep Python for next time
        if: steps.python.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/python/dist
          key: ${{ steps.python.outputs.cache-primary-key }}

      - name: Playwright and Chromium, for the pages in a browser (browser_test.go)
        # global, beside the pages' own pinned tools rather than in them: nothing of it is the app's
        env:
          PLAYWRIGHT: 1.63.0
        run: |
          npm install -g "playwright@$PLAYWRIGHT"
          npx -y "playwright@$PLAYWRIGHT" install --with-deps chromium
          echo "NODE_PATH=$(npm root -g)" >> "$GITHUB_ENV"

      - name: Tests (with the fuzzers' seeds, and the pages in a browser) and the self-test
        if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
        env:
          NO_SKIPS: 1 # everything is here: a test that skips is a layer gone missing (scripts/testreport)
          ALLOW_SKIPS: ^TestPreviewAudioCard$
        run: scripts/test.sh

      - name: Fuzz the command graph
        env:
          FUZZTIME: ${{ github.event_name == 'schedule' && '15m' || github.event_name == 'workflow_dispatch' && inputs.fuzztime || '1m' }}
        run: scripts/fuzz.sh

      - name: Keep what the fuzzers found
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-failures
          path: |
            testdata/fuzz
            apps/testdata/fuzz
          # a failing browser walk prints its BROWSER_SEED in the log
          if-no-files-found: ignore

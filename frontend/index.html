<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Open House Party</title>
    <link rel="stylesheet" href="app.css">
</head>
<body>
    <div class="big">
        <button id="play" class="tile" aria-label="Play"></button>
        <button id="link" class="tile" aria-label="Copy link"></button>
    </div>
    <div class="bar">
        <input id="slider" type="range" min="0" max="1" step="any" value="0" disabled>
        <span id="time"></span>
    </div>
    <div id="list" class="list" tabindex="0">
        <div id="hint" class="hint">Drag videos, music or PDFs here</div>
    </div>
    <script src="icons.js"></script>
    <script src="app.js"></script>
</body>
</html>

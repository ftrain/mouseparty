<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mouse Party</title>
    <link rel="stylesheet" href="app.css">
</head>
<body>
    <div class="big">
        <button id="play" class="tile" aria-label="Play"></button>
        <button id="link" class="tile" aria-label="Copy link"></button>
    </div>
    <div class="bar">
        <input id="slider" aria-label="Playhead" type="range" min="0" max="1" step="any" value="0" disabled>
        <span id="time"></span>
    </div>
    <div id="list" class="list" tabindex="0" role="listbox" aria-label="The list">
        <div id="hint" class="hint">Drag videos, sound, documents, databases or zips here, or add a download link (Party menu)</div>
    </div>
    <div id="sheet" class="sheet" role="dialog" aria-modal="true" hidden></div>
    <script type="module" src="app.js"></script>
</body>
</html>
